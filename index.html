<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 번역기</title>
</head>
<body>

    <h1>포켓몬 번역기 (v2)</h1>
    
    <div>
        <select id="sourceLang">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
        </select>
        <input type="text" id="searchInput" placeholder="포켓몬 이름 입력">
    </div>

    <br>
    <button id="translateButton">⬇️ 번역 ⬇️</button>
    <br><br>

    <div>
        <select id="targetLang">
            <option value="ko">한국어</option>
            <option value="en" selected>English</option> <option value="ja">日本語</option>
        </select>
        <input type="text" id="resultArea" readonly placeholder="번역 결과">
    </div>

    <script src="script.js"></script>
</body>
</html>
