<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 번역기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="themeToggle" title="테마 변경">🌙</button>

    <div class="container">

        <div class="category-header">
            <h1>포켓몬 번역기</h1>
            <select id="categorySelect">
                <option value="" disabled selected hidden>카테고리 선택</option>
                <option value="pokemon">포켓몬</option>
                <option value="ability">특성</option>
                <option value="move">기술</option>
                <option value="item">도구</option>
                <option value="character">인물</option>
                <option value="location">장소</option>
                <option value="nature">성격</option>
            </select>
        </div>

        <div class="translation-wrapper">

            <div class="language-box" id="sourceBox">
                <div class="language-select-wrapper">
                    <select id="sourceLang">
                        <option value="" disabled selected hidden>언어 선택</option>
                        <option value="ko">한국어</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                    </select>
                    <button id="swapButton" title="언어 교환">🔁</button>
                    <select id="targetLang">
                        <option value="" disabled selected hidden>언어 선택</option>
                        <option value="ko">한국어</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                    </select>
                </div>
                <textarea id="searchInput" placeholder="번역할 이름 입력... (Enter로 검색)"></textarea>
            </div>

            <button id="translateButton">⬇️ 번역하기 ⬇️</button>

            <div class="language-box" id="targetBox">
                <textarea id="resultArea" readonly placeholder="번역 결과..."></textarea>
            </div>

        </div> </div> <script src="script.js"></script>
</body>
</html>
