<!DOCTYPE html>
<html lang="zxx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator for Pokémon</title>

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#ff0000"> <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker: Registered'))
            .catch(err => console.log('Service Worker: Error', err));
        });
      }
    </script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="themeToggle" title="테마 전환">🌙</button>

    <div class="container">

        <div class="category-header">
            <h1>Translator for Pokémon</h1>
            <select id="categorySelect">
                <option value="all" selected>전체(All)</option>
                <option value="pokemon">포켓몬(Pokémon)</option>
                <option value="ability">특성(Ability)</option>
                <option value="move">기술(Move)</option>
                <option value="item">도구(Item)</option>
                <option value="nature">성격(Nature)</option>
            </select>
        </div>

        <div class="translation-wrapper">

            <div class="language-box" id="sourceBox">
                <select id="sourceLang">
                    <option value="auto" selected>자동(Auto)</option>
                    <option value="dex_id" class="pokemon-only-option" hidden>도감 번호(Pokédex Number)</option>
                    <option value="stats" class="nature-only-option" hidden>능력치 변화(Stats)</option>
                    <option value="ko">한국어</option>
                    <option value="ja">日本語</option>
                    <option value="en">English</option>
                    <option value="es">Español (España)</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="it">Italiano</option>
                    <option value="zh-Hans">简体中文</option>
                    <option value="zh-Hant">繁體中文</option>
                </select>
                <textarea id="searchInput" placeholder="번역할 이름 입력... (Enter로 검색)"></textarea>
                <button class="copy-btn" id="copySource" title="복사하기">Copy</button>
            </div>

            <button id="swapButton" title="언어 교환">🔁</button>

         <div class="language-box" id="targetBox">
            <select id="targetLang">
                <option value="" disabled selected hidden>언어(Language)</option>
                <option value="dex_id" class="pokemon-only-option" hidden>도감 번호(Pokédex Number)</option>
                <option value="stats" class="nature-only-option" hidden>능력치 변화(Stats)</option>
                <option value="ko">한국어</option>
                <option value="ja">日本語</option>
                <option value="en">English</option>
                <option value="es">Español (España)</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="zh-Hans">简体中文</option>
                <option value="zh-Hant">繁體中文</option>
            </select>
             
                <div class="result-container">
                    <div id="resultArea" placeholder="번역 결과..."></div>
                    <div id="pronHangeul" class="sub-reading"></div>
                    <div id="pronRomaji" class="sub-reading"></div>
                </div>
                <button class="copy-btn" id="copyTarget" title="복사하기">Copy</button>
            </div> </div> <script src="script.js"></script>
</body>
</html>
